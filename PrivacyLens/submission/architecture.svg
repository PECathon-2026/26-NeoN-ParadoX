<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430"><style>text{font-family:Arial,sans-serif;fill:#172033}.box{fill:#fff;stroke:#526be0;stroke-width:2}.safe{fill:#e8fff1;stroke:#159957}.danger{fill:#fff0ed;stroke:#d33}</style><rect width="1100" height="430" fill="#f4f7fb"/><text x="40" y="45" font-size="26" font-weight="bold">PrivacyLens — local privacy boundary</text><g font-size="16" text-anchor="middle"><rect class="box" x="35" y="100" width="170" height="85" rx="12"/><text x="120" y="135">Webpage /</text><text x="120" y="160">Screenshot</text><path d="M205 142h50" stroke="#526be0" stroke-width="3" marker-end="url(#a)"/><rect class="box" x="255" y="100" width="170" height="85" rx="12"/><text x="340" y="135">Local extractor</text><text x="340" y="160">DOM / OCR</text><path d="M425 142h50" stroke="#526be0" stroke-width="3"/><rect class="box" x="475" y="100" width="170" height="85" rx="12"/><text x="560" y="135">PII detector</text><text x="560" y="160">+ confidence</text><path d="M645 142h50" stroke="#526be0" stroke-width="3"/><rect class="box" x="695" y="100" width="170" height="85" rx="12"/><text x="780" y="135">Sanitizer</text><text x="780" y="160">typed placeholders</text><path d="M865 142h50" stroke="#526be0" stroke-width="3"/><rect class="safe" x="915" y="100" width="150" height="85" rx="12"/><text x="990" y="135">AI planner</text><text x="990" y="160">safe context</text><path d="M990 185v65" stroke="#526be0" stroke-width="3"/><rect class="box" x="855" y="250" width="210" height="85" rx="12"/><text x="960" y="285">Action guard</text><text x="960" y="310">allow / approve / block</text><path d="M855 292H650" stroke="#526be0" stroke-width="3"/><rect class="danger" x="430" y="250" width="220" height="85" rx="12"/><text x="540" y="285">Raw secret detected</text><text x="540" y="310">fail closed + log reason</text><text x="40" y="390" text-anchor="start" font-size="15">Raw data remains local. Only sanitized context crosses the AI boundary.</text></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#526be0"/></marker></defs></svg>
