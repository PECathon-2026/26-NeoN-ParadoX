<!doctype html><html><head><meta charset="utf-8"><title>PrivacyLens Agent Guard</title><style>body{font:16px system-ui;max-width:900px;margin:35px auto;background:#f5f7fb;color:#172033}.box{background:white;border:1px solid #dde4ef;border-radius:14px;padding:20px;margin:15px 0}textarea,input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cdd7e6;border-radius:8px;margin:6px 0 12px}button{background:#526be0;color:#fff;border:0;border-radius:8px;padding:11px 15px;font-weight:700;cursor:pointer}.safe{color:#08753d;font-weight:700}.warn{color:#b42318;font-weight:700}.mono{white-space:pre-wrap;background:#f5f7fb;padding:12px;border-radius:8px}</style></head><body><h1>PrivacyLens end-to-end agent guard</h1><p>Page/screenshot context → local sanitization → AI task plan → action safety gate.</p><div class="box"><h2>1. Interface context</h2><textarea id="context">Checkout page: Maya's card is 4111 1111 1111 1111. Click Pay now to complete the order.</textarea><button onclick="run()">Sanitize and plan action</button></div><div class="box"><h2>2. Model-facing context</h2><div id="safe" class="mono">—</div></div><div class="box"><h2>3. Proposed agent action</h2><label>Action type</label><input id="type" value="click"><label>Target</label><input id="target" value="Pay now"><button onclick="run()">Validate action</button><div id="result" style="margin-top:15px">—</div></div><script>async function run(){let context=document.getElementById('context').value;let a={type:document.getElementById('type').value,target:document.getElementById('target').value};let x=await (await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:context})})).json();document.getElementById('safe').textContent=x.sanitized;let p=await (await fetch('/api/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task:'Complete checkout',context:x.sanitized,action:a})})).json();let v=p.validation;document.getElementById('result').innerHTML='<strong class="'+(v.decision==='ALLOW'?'safe':'warn')+'">'+v.decision+'</strong><br>'+v.reasons.join('<br>')}</script></body></html>
